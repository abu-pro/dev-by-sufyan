name: Dev by Sufyan — Windows build

# Builds DevBySufyan.exe (Red Panda C++ + Rooms, rebranded) on a Windows
# runner, stages a portable folder with windeployqt, and wraps it in an
# Inno Setup installer (DevBySufyan-Setup.exe).
#
# The Qt setup mirrors upstream's own Windows MSVC CI job
# (.github/workflows/build-app.yml, job "windows_msvc"): windows-2022,
# jurplel/install-qt-action@v4, Qt 6.8.3, arch win64_msvc2022_64.
# One addition vs upstream: the "qtwebsockets" add-on module (requested
# via the action's "modules" input). Upstream's build
# does not need it, but this fork's CMake lists WebSockets among its
# REQUIRED Qt components (the Rooms client uses QWebSocket), and
# qtsvg is kept because CMake also requires the Svg component.

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  windows-setup:
    name: Windows x64 setup (MSVC + Qt 6.8.3)
    runs-on: windows-2022
    # Lets the final step publish the GitHub Release with the built files.
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Qt 6.8.3 (MSVC 2022, x64)
        id: qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          archives: qtbase qtsvg qttools qttranslations
          # WebSockets is an add-on module in Qt 6, not a base archive:
          # it must be requested via "modules" or aqtinstall silently
          # skips it and CMake cannot find Qt6WebSockets (run 1 failure).
          modules: qtwebsockets

      # Upstream enters the VS 2022 developer shell the same way; the
      # environment it sets up only lives inside this step, so configure,
      # build and install all happen here (same layout as upstream's
      # packages/msvc/build.ps1: Ninja generator, Release, install with
      # --strip into the package folder, then windeployqt --release).
      - name: Configure, build and stage deploy folder
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $VsInstallPath = "C:/Program Files/Microsoft Visual Studio/2022/Enterprise"
          Import-Module "$VsInstallPath/Common7/Tools/Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -Arch amd64 -VsInstallPath $VsInstallPath -SkipAutomaticLocation

          # install-qt-action v4 exports QT_ROOT_DIR; its "qt-dir" step
          # output is empty, which left $QtDir blank and broke the
          # windeployqt path in run 2. Prefer the env var.
          $QtDir = $env:QT_ROOT_DIR
          if (-not $QtDir) { $QtDir = "${{ steps.qt.outputs.qt-dir }}" }
          if (-not $QtDir) { throw "Qt directory not found (QT_ROOT_DIR empty)" }
          $DeployDir = Join-Path $PWD "deploy"

          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_INSTALL_PREFIX="$DeployDir" `
            -DCMAKE_PREFIX_PATH="$QtDir" `
            -DPORTABLE_CONFIG=non
          if ($LASTEXITCODE -ne 0) { throw "CMake configure failed" }

          # Builds the default target set (RedPandaIDE -> DevBySufyan.exe
          # plus the helper tools the IDE installs, e.g. astyle and
          # consolepauser) so cmake --install produces a complete folder.
          cmake --build build --parallel
          if ($LASTEXITCODE -ne 0) { throw "Build failed" }

          cmake --install build --strip
          if ($LASTEXITCODE -ne 0) { throw "Install/staging failed" }

          $exe = Join-Path $DeployDir "DevBySufyan.exe"
          if (-not (Test-Path $exe)) { throw "DevBySufyan.exe not found in deploy folder" }

          & "$QtDir/bin/windeployqt.exe" --release "$exe"
          if ($LASTEXITCODE -ne 0) { throw "windeployqt failed" }

          Copy-Item LICENSE (Join-Path $DeployDir "LICENSE") -Force
          # v1.3.0: ship the logo as a standalone icon file too. The
          # Inno shortcuts point at {app}\devbysufyan.ico explicitly,
          # so they no longer depend on the exe-path icon cache (which
          # kept showing the old red-panda icon after upgrades).
          Copy-Item "RedPandaIDE\images\devcpp.ico" (Join-Path $DeployDir "devbysufyan.ico") -Force
          if (-not (Test-Path (Join-Path $DeployDir "devbysufyan.ico"))) { throw "devbysufyan.ico missing after staging" }
          Get-ChildItem $DeployDir | Select-Object Name, Length

      # v1.2.0: bundle a real compiler. v1.1.0 shipped the IDE alone, so
      # Compile & Run was dead on a clean PC. Red Panda's first run calls
      # CompilerSets::findSets, which scans the exe folder for mingw*/gcc*
      # directories and builds compiler sets from <dir>\bin\gcc.exe — so
      # staging niXman MinGW as deploy\mingw64 (the upstream layout) makes
      # the installed app find GCC/G++ with no configuration. The Inno
      # script already packages deploy\* recursively, and the portable zip
      # is made from the same folder, so both deliverables get it.
      - name: Download and stage MinGW compiler (niXman GCC 14.2.0)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $mingwUrl = "https://github.com/niXman/mingw-builds-binaries/releases/download/14.2.0-rt_v12-rev2/x86_64-14.2.0-release-posix-seh-ucrt-rt_v12-rev2.7z"
          curl.exe -L --fail -o "mingw.7z" $mingwUrl
          if ($LASTEXITCODE -ne 0) { throw "MinGW download failed" }
          $archive = Get-Item "mingw.7z"
          if ($archive.Length -lt 80000000) { throw "MinGW archive suspiciously small: $($archive.Length) bytes" }
          $sevenZip = "C:\Program Files\7-Zip\7z.exe"
          if (-not (Test-Path $sevenZip)) { throw "7z.exe not found at $sevenZip" }
          & $sevenZip x "mingw.7z" -o"mingw-extract" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "MinGW extraction failed" }
          # Locate bin\gcc.exe wherever the archive rooted its tree and
          # stage that root as deploy\mingw64.
          $gcc = Get-ChildItem "mingw-extract" -Recurse -Filter "gcc.exe" |
            Where-Object { $_.Directory.Name -eq "bin" } | Select-Object -First 1
          if (-not $gcc) { throw "gcc.exe not found inside the MinGW archive" }
          $mingwRoot = $gcc.Directory.Parent.FullName
          Copy-Item $mingwRoot (Join-Path $PWD "deploy\mingw64") -Recurse
          if (-not (Test-Path "deploy\mingw64\bin\g++.exe")) { throw "g++.exe missing after staging MinGW" }
          & "deploy\mingw64\bin\gcc.exe" --version | Select-Object -First 1
          Remove-Item "mingw.7z" -Force
          Remove-Item "mingw-extract" -Recurse -Force

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }
          & $iscc "installer\DevBySufyan.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compile failed" }
          if (-not (Test-Path "DevBySufyan-Setup.exe")) { throw "DevBySufyan-Setup.exe was not produced" }
          Get-Item "DevBySufyan-Setup.exe" | Select-Object Name, Length

      - name: Upload setup installer
        uses: actions/upload-artifact@v4
        with:
          name: DevBySufyan-Setup
          path: DevBySufyan-Setup.exe
          if-no-files-found: error

      - name: Upload portable folder
        uses: actions/upload-artifact@v4
        with:
          name: DevBySufyan-Portable
          path: deploy
          if-no-files-found: error

      - name: Zip the portable folder for the release
        shell: pwsh
        run: |
          Compress-Archive -Path "deploy\*" -DestinationPath "DevBySufyan-Portable.zip"
          Get-Item "DevBySufyan-Portable.zip" | Select-Object Name, Length

      # Publishes (or updates) the v1.6.0 release with the installer and the
      # portable zip attached, using the runner's built-in GITHUB_TOKEN.
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.6.0
          name: Dev by Sufyan — Red Panda Edition (v1.6.0)
          body: |
            **Dev by Sufyan — Red Panda Edition (v1.6.0)**

            The Red Panda C++ IDE with live **Rooms** built in, rebranded as Dev by Sufyan.

            New in v1.6.0:
            - **Updater fixed — downloads resume and the install is recoverable** — updates now download into a kept folder (AppData DevBySufyan updates); a stalled or dropped download **resumes from where it stopped** instead of restarting (HTTP Range resume plus a stall watchdog that reconnects on its own); the file is only accepted when its size matches the release exactly; and after downloading, a panel shows the installer's exact saved path with an **Open Installer** button, so even if the automatic launch is blocked (Winlator), one click — or running the shown file yourself — finishes the job
            - **Three full theme packs: Demon Slayer, Dragon Ball, My Hero Academia** (Themes menu) — each brings its own editor colour scheme, icon tint, curated wallpapers, a matching loading screen and its own ambient effects. The five classic anime themes keep working as before
            - **Full-screen Home** — Home now owns the whole window: wallpaper edge to edge, panels and toolbars tucked away. Open or create a document and the full IDE layout comes back; return to Home and it is full-screen again
            - **Customize Home** — a new tile on Home (and in the Themes menu) lets you pick exactly which wallpaper of the active theme Home shows, or rotate them all — saved per theme. Every wallpaper was chosen so the character's face stays fully visible, never under the tiles
            - **GTA-style loading screen** — every start opens with full-screen artwork from your current theme, the Dev by Sufyan wordmark, a progress bar and rotating tips
            - **Special effects per theme** (Themes menu toggle, on by default, pauses when the window is not active) — Demon Slayer: lightning flashes, drifting embers and a little snake that slips along the Rooms panel; Dragon Ball: a golden aura pulse, rising energy sparks and ki flashes; My Hero Academia: spark bursts, comic speed lines and Plus Ultra colour pops
            - **Theme backdrops** — with a pack active, its wallpaper also sits dimmed behind the side and bottom panels, while the code editor keeps its solid readable background

            Updating from v1.5.1: the in-app updater in v1.5.1 could download but not install — for THIS update, please download `DevBySufyan-Setup.exe` below and run it once (install-over; files and settings are kept). From v1.6.0 on, the in-app updater resumes downloads and shows the installer panel described above.

            Everything from v1.5.1 is still here: Fix Lagao one-click fixes with preview + undo, Fix & Recheck, the 210-entry error dictionary with its search window, Program Templates on Home, 60-member rooms with the live ping indicator, auto-save + crash recovery, live cursors, admin line pointing, Side by Side, Run All & Compare, code photo and flowchart.

            - `DevBySufyan-Setup.exe` — Windows installer (Start Menu shortcut + uninstaller)
            - `DevBySufyan-Portable.zip` — portable folder, no install needed
            - The Android app stays at v1.3.0 this round — get `DevBySufyan.apk` from the v1.3.0 release (it shares the same live rooms)

            Rooms: create or join a room with a 4-digit code and code together live — PC and phone share the same rooms. The admin can view and edit everyone's code; the admin's own code stays view-only for everyone else.

            Made by Abu Sufyan. Based on Red Panda C++ by Roy Qu and contributors — GNU GPL v3 (see LICENSE in this repo).
          files: |
            DevBySufyan-Setup.exe
            DevBySufyan-Portable.zip
