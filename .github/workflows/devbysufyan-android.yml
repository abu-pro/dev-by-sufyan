name: Dev by Sufyan — Android build

# Builds the Android app (android/ in this repo) on a Linux runner and
# attaches DevBySufyan.apk to the v1.3.0 GitHub Release, next to the
# Windows setup produced by devbysufyan-windows.yml. Release assets must
# be published from inside Actions (the connector cannot upload to
# uploads.github.com), hence the softprops step at the end.
#
# Signing (since v1.2.0): ONE long-lived keystore, stored base64-encoded
# in the DBS_KEYSTORE_B64 repo secret (passwords in DBS_KEYSTORE_PASS /
# DBS_KEY_PASS, alias in DBS_KEY_ALIAS). Every release is signed with the
# same key, so new APKs install over old ones — v1.3.0 installs straight
# over v1.2.0.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/devbysufyan-android.yml'

jobs:
  android-apk:
    name: Android APK (Temurin 21 + Gradle 8.9)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Decode signing keystore (fixed key from repo secrets)
        run: |
          echo "${{ secrets.DBS_KEYSTORE_B64 }}" | base64 --decode > "$RUNNER_TEMP/dbs.keystore"
          test -s "$RUNNER_TEMP/dbs.keystore"

      - name: Build release APK
        env:
          DBS_KEYSTORE: ${{ runner.temp }}/dbs.keystore
          DBS_KEYSTORE_PASS: ${{ secrets.DBS_KEYSTORE_PASS }}
          DBS_KEY_ALIAS: ${{ secrets.DBS_KEY_ALIAS }}
          DBS_KEY_PASS: ${{ secrets.DBS_KEY_PASS }}
        run: gradle assembleRelease --console=plain

      - name: Stage APK at repo root
        run: cp app/build/outputs/apk/release/app-release.apk ../DevBySufyan.apk

      # Adds DevBySufyan.apk to the v1.3.0 release (created by the
      # Windows workflow); creates the release if it does not exist.
      - name: Attach APK to release v1.3.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.0
          name: Dev by Sufyan — Red Panda Edition (v1.3.0)
          body: |
            **Dev by Sufyan — Red Panda Edition (v1.3.0)**

            The 10/10 polish release (full notes are on the Windows assets of this release):

            - **Anime welcome screen** — rotating artwork pack on the start page
            - **5 anime editor themes** — Sukuna, Gojo, Zenitsu, Naruto x Sasuke, Luffy Gear 5 — with icons that follow the theme
            - **Messages popup** — room chat in its own window that opens itself when a message arrives
            - **Tabbed Rooms panel** and Rooms menu access to Messages / Code / Members / Settings
            - **Admin per-member edit restrictions**, enforced by the server
            - **Android parity**: restriction badge + admin toggle, unread chat badge

            Note for Android: signed with the same fixed key as v1.2.0, so this APK installs straight over the previous version.

            Made by Abu Sufyan. Based on Red Panda C++ by Roy Qu and contributors — GNU GPL v3 (see LICENSE in this repo).
          files: DevBySufyan.apk
